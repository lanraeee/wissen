# Nightly jobs for the live app. Runs against Vercel (vars.APP_URL) -- DNS
# confirms that is what www.wissenhaus.org actually resolves to, and so the
# host whose env vars are the ones that matter. This previously targeted an
# Azure App Service deployment (docs/AZURE_DEPLOYMENT.md) via
# vars.AZURE_APP_URL, which left Vercel's own `crons` list in vercel.json
# empty; repointed back to Vercel on 2026-10-08 after Azure's env silently
# fell behind Vercel's (missing ZEFFY_API_KEY meant Zeffy donations never
# synced to the ledger). If a native Vercel Cron is ever added back to
# vercel.json for any of these routes, drop the matching job here first --
# otherwise it runs twice.
#
# Both routes run in one job, in order: the knowledge rebuild summarises the
# listings the opportunities job has just refreshed, so it must not start
# before that one finishes.
#
# Needs:
#   vars.APP_URL        - repository variable, e.g. https://www.wissenhaus.org
#                         (no trailing slash). Not a secret: it is a public URL.
#   secrets.CRON_SECRET - must equal the CRON_SECRET env var on the Vercel
#                         project (Project Settings -> Environment Variables).

name: Nightly crons

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        options: [both, opportunities, knowledge, recurring-giving]
        default: both

concurrency:
  group: nightly-crons
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ vars.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      JOB: ${{ inputs.job || 'both' }}
    steps:
      # A missing variable or secret expands to '', which would turn into a
      # request to "/api/cron/..." or an empty bearer token and a confusing
      # curl error. Fail with the name of what is missing instead.
      - name: Verify configuration
        run: |
          missing=0
          if [ -z "$APP_URL" ]; then
            echo "::error::Repository variable APP_URL is missing or empty."
            missing=1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Repository secret CRON_SECRET is missing or empty, or does not match the Vercel project's CRON_SECRET."
            missing=1
          fi
          exit $missing

      # --max-time 240: App Service's front end drops a request at 230s, so
      # waiting longer than that only delays the failure.
      - name: Refresh opportunities
        if: env.JOB == 'both' || env.JOB == 'opportunities'
        run: |
          curl -fsS -X POST --max-time 240 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/opportunities"

      - name: Rebuild knowledge base
        if: env.JOB == 'both' || env.JOB == 'knowledge'
        run: |
          curl -fsS -X POST --max-time 240 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/knowledge"

      - name: Recurring giving reminders
        if: env.JOB == 'both' || env.JOB == 'recurring-giving'
        run: |
          curl -fsS -X POST --max-time 240 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/recurring-giving"

# Hourly bank-feed sync for the public ledger (/api/cron/ledger), so it stays
# current when no director opens the Financial Ledger tab. Optional: opening
# that tab also syncs any feed older than 15 minutes.
#
# Same configuration as nightly-crons.yml: vars.AZURE_APP_URL and
# secrets.CRON_SECRET. See "5. Replace the crons" in docs/AZURE_DEPLOYMENT.md.

name: Ledger sync

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

concurrency:
  group: ledger-sync
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ vars.AZURE_APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Verify configuration
        run: |
          missing=0
          if [ -z "$APP_URL" ]; then
            echo "::error::Repository variable AZURE_APP_URL is missing or empty. See step 5 in docs/AZURE_DEPLOYMENT.md."
            missing=1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Repository secret CRON_SECRET is missing or empty. See step 5 in docs/AZURE_DEPLOYMENT.md."
            missing=1
          fi
          exit $missing

      - name: Sync ledger
        run: |
          curl -fsS -X POST --max-time 240 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/ledger"

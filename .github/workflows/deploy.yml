name: CI

# This used to validate and publish a `redesign/` directory to Netlify. That
# directory no longer exists, so `cd redesign` failed on every push. The app is
# deployed by the Vercel Git integration, not from here — this workflow now does
# what its name in the README claims: validate the code before it merges.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # next.config.mjs re-exports JWT_SECRET through its `env` key, so the
          # build needs a value present. This one is a throwaway: CI never
          # deploys its output, and runtime secrets come from Vercel.
          JWT_SECRET: ci-build-placeholder-not-a-real-secret
